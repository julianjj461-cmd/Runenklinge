<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0d0b12">
<style>html,body{margin:0;background:#0d0b12}[hidden]{display:none!important}</style>
<title>Runenklinge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: Kampfbühne oben, Konsole darunter, Tab-Leiste unten im Daumenbereich. Breit: Bühne links, Konsole rechts. Bewusst nur dunkel. */
:root{
  --void:#0d0b12; --deep:#15121c; --panel:#1b1724; --raise:#262031; --line:#312a3f; --line2:#41395a;
  --text:#efe9f4; --dim:#a69fb3; --faint:#6f6782;
  --gold:#f2c14e; --gold-hi:#ffdb80; --gold-lo:#a8791a; --gold-ink:#241703; --gold-dim:rgba(242,193,78,.22);
  --mana:#7aa8ff; --mana-lo:#3b5cae; --rose:#ef8193; --rose-lo:#9b3f4f; --xp:#b68cff; --good:#77d39a; --bad:#ef6b5b;
  --glass:rgba(13,11,18,.78);
  --f-display:"Cinzel","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--void);touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body,button,select,.sheet{touch-action:manipulation}
body{height:100%;margin:0;background:var(--void);color:var(--text);font:15px/1.4 var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,canvas:focus-visible,select:focus-visible{outline:2px solid var(--mana);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:1200px;margin:0 auto;display:grid;gap:8px;padding-block:8px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"pager" "nav"}
@media (min-width:860px){.app{grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"view pager" "view nav";gap:12px;padding-block:16px}}
/* Seiten zum Wischen */
.pager{grid-area:pager;position:relative;min-height:0;overflow:hidden}
.page{height:100%;min-width:0}
.page:not(.cur){display:none!important}
.page-fight{display:flex}
.page-fight .view{flex:1;height:100%}
@media (min-width:860px){.page-fight{display:none}.nb[data-tab="fight"]{display:none}.nav{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
.goldchip{display:none;align-items:baseline;gap:4px;padding:5px 10px;border-radius:999px;border:1px solid var(--gold-lo);color:var(--gold-hi);font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap}
.goldchip small{font-family:var(--f-body);font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:859px){.sh .sh-t{flex:1 1 100%}.goldchip{display:inline-flex}.tscroll{height:max(340px,calc(100dvh - 360px))}}

/* Bühne */
.view{grid-area:view;position:relative;min-height:0;border-radius:20px;overflow:hidden;background:var(--void);border:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px 26px;
  background:linear-gradient(rgba(13,11,18,.86),rgba(13,11,18,0));pointer-events:none}
.hud-l{min-width:0;flex:1 1 auto;max-width:260px}
.gold{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--gold-hi);text-shadow:0 2px 12px rgba(0,0,0,.7);white-space:nowrap;transform-origin:left 70%}
.gold small{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.gold.bump{animation:bump .16s ease-out}
@keyframes bump{40%{transform:scale(1.07)}}
.dps{font-size:12.5px;font-weight:700;color:var(--text);margin-top:3px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;gap:5px;margin-top:7px}
.blab{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--dim);margin-bottom:2px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--gold);transition:width .2s}
.bar.xp i{background:var(--xp)} .bar.mana i{background:var(--mana)} .bar.good i{background:var(--good)} .bar.rose i{background:var(--rose)}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto;flex:none}
.zonebox{display:flex;align-items:center;gap:4px;padding:3px;border-radius:12px;background:var(--glass);border:1px solid var(--line2)}
.zb{width:32px;height:32px;border-radius:9px;border:0;background:none;display:grid;place-items:center;color:var(--text)}
.zb:disabled{opacity:.3;cursor:default}
.zb svg{width:18px;height:18px}
.zb.on{background:var(--gold);color:var(--gold-ink)}
.zname{min-width:70px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1.1}
.zname small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--dim)}
.hrow{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--glass);display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--gold);background:var(--glass);color:var(--gold);font-weight:800;font-size:13px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.on{background:var(--gold);color:var(--gold-ink)}
.pill:disabled{border-color:var(--line2);color:var(--dim);cursor:default}
.skillbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end;pointer-events:none}
.sk{pointer-events:auto;position:relative;width:48px;height:48px;border-radius:14px;border:1px solid var(--mana);background:var(--glass);color:var(--mana);display:grid;place-items:center;overflow:hidden;flex:none}
.sk svg{width:22px;height:22px;position:relative;z-index:1;margin-top:-6px}
.sk::before{content:"";position:absolute;inset:0;background:conic-gradient(rgba(13,11,18,.85) calc(var(--cd,0)*360deg),transparent 0)}
.sk .c{position:absolute;left:0;right:0;bottom:4px;z-index:1;text-align:center;font-size:10.5px;font-weight:800;line-height:1}
.sk .k{position:absolute;left:4px;top:3px;z-index:1;font-size:9.5px;font-weight:800;color:var(--faint)}
.sk:disabled{border-color:var(--line2);color:var(--faint);cursor:default}
.sk.fired{animation:fired .4s ease-out}
@keyframes fired{0%{box-shadow:0 0 0 0 rgba(122,168,255,.8)}100%{box-shadow:0 0 0 14px rgba(122,168,255,0)}}
.bubble{position:absolute;left:10px;right:10px;bottom:68px;display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;
  background:var(--glass);border:1px solid var(--line2);border-radius:14px;pointer-events:none;transition:opacity .25s,transform .25s;max-width:460px}
.bubble.off{opacity:0;transform:translateY(6px)}
.bubble p{margin:0;font-size:13px;line-height:1.25;min-width:0}
@media (max-width:520px){.bubble{bottom:66px;padding:6px 10px 6px 6px;background:rgba(13,11,18,.68)}.bubble .av{display:none}}
.bubble b{display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.1em;color:var(--dim)}
.av{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--gold-ink);background:var(--gold)}
.av.sm{width:30px;height:30px;font-size:13px;border-radius:9px}
.av.mara{background:var(--rose)}

/* Konsole */
.sheet{min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:0 12px 14px}
.sh{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 2px 12px;margin-bottom:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.sh-t{flex:1;min-width:0}
.sh h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.15}
.sh p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--deep);border:1px solid var(--line);flex:1 1 100%}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:7px;padding:6px 4px;font-size:13px;font-weight:800;color:var(--dim);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--gold)}
.pts{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--xp);padding:6px 10px;border:1px solid var(--xp);border-radius:999px;white-space:nowrap}
.crewline{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.crewline p{margin:0;font-size:14px;color:var(--dim);font-style:italic;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--deep);border:1px solid var(--line);border-radius:14px;transition:border-color .2s}
.row.ready{border-color:rgba(242,193,78,.5)}
.row.flash{animation:flash .4s ease-out}
@keyframes flash{0%{background:rgba(242,193,78,.25)}}
.row.locked{opacity:.55}
.tile{position:relative;width:46px;height:46px;flex:none;border-radius:12px;background:var(--raise);display:grid;place-items:center;color:var(--gold)}
.tile svg{width:24px;height:24px}
.tile.mana{color:var(--mana)} .tile.dim{color:var(--faint)}
.cnt{position:absolute;right:-6px;bottom:-6px;min-width:22px;height:21px;padding:0 5px;border-radius:11px;background:var(--text);color:var(--void);font-size:11.5px;font-weight:800;display:grid;place-items:center}
.info{flex:1;min-width:0}
.nm{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.lvb{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:var(--gold-dim);color:var(--gold-hi);font-family:var(--f-body);font-size:11.5px;font-weight:800;vertical-align:1px}
.ds{font-size:13px;color:var(--dim);margin-top:2px}
.meta{font-size:12.5px;color:var(--mana);margin-top:3px}
.ms{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--faint)}
.ms .bar{flex:1 1 50px;max-width:110px;min-width:40px;height:4px;background:var(--line)}
.ms span{flex:none;white-space:nowrap}
.buy{flex:none;width:100px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 8px;border:0;border-radius:12px;
  background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-lo);transition:transform .06s,box-shadow .06s}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--gold-lo)}
.buy .bc{font-size:16px;font-weight:800;line-height:1.1}
.buy .bq{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.85}
.buy:disabled{background:linear-gradient(90deg,var(--gold-dim) var(--p,0%),var(--raise) var(--p,0%));color:var(--dim);box-shadow:none;cursor:default}
.buy.mana{background:var(--mana);color:#0d1430;box-shadow:0 3px 0 var(--mana-lo)}
.buy.xp{background:var(--xp);color:#1c0f33;box-shadow:0 3px 0 #6a49a8}
.buy.rose{background:var(--rose);color:#2a0a10;box-shadow:0 3px 0 var(--rose-lo)}
.buy.mana:disabled,.buy.xp:disabled,.buy.rose:disabled{background:var(--raise);color:var(--dim);box-shadow:none}
.buy.gate:disabled{background:linear-gradient(90deg,rgba(122,168,255,.22) var(--p,0%),var(--raise) var(--p,0%));box-shadow:inset 0 0 0 1px var(--mana-lo);color:var(--mana)}
.buy.wide{width:100%}
.buy.glow:not(:disabled){animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.18)}}
.card{padding:14px;background:var(--deep);border:1px solid var(--line);border-radius:14px;display:grid;gap:10px}
.card h3{margin:0;font-family:var(--f-display);font-size:16px}
.card p{margin:0;color:var(--dim);font-size:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.h3{margin:16px 2px 8px;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--dim)}
.note{font-size:13px;color:var(--faint);margin:12px 2px 0}
.ghost{background:none;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--dim);font-size:13.5px}
.ghost.armed{border-color:var(--bad);color:var(--bad)}
.pips{display:flex;gap:6px}
.pips i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--good)}

/* Talentbaum */
.tdetail{position:sticky;top:76px;z-index:2;display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;border-radius:14px;background:var(--deep);border:1px solid var(--line2);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tdetail .info .ds{color:var(--text)}
.tscroll{position:relative;height:380px;overflow:auto;border-radius:14px;background:radial-gradient(circle at 50% 50%,#211b2e,var(--deep) 70%);border:1px solid var(--line);overscroll-behavior:contain;touch-action:pan-x pan-y}
.tscroll svg{display:block}
.tn{cursor:pointer}
.tn circle.b{fill:var(--deep);stroke:var(--line2);stroke-width:2}
.tn .g{color:var(--faint)}
.tn.av circle.b{stroke:var(--gold);stroke-width:2.5}
.tn.av .g{color:var(--gold-hi)}
.tn.av circle.halo{stroke:var(--gold);opacity:.5;animation:halo 1.6s ease-in-out infinite}
@keyframes halo{50%{opacity:.1}}
.tn.on circle.b{fill:var(--gold);stroke:var(--gold-hi)}
.tn.on .g{color:var(--gold-ink)}
.tn.sel circle.b{stroke:var(--mana);stroke-width:3.5}
.tn.key circle.b{stroke-dasharray:4 3}
.tl{stroke:var(--line2);stroke-width:3}
.tl.on{stroke:var(--gold);opacity:.8}
.tlab{fill:var(--dim);font:700 11.5px var(--f-body);text-anchor:middle;paint-order:stroke;stroke:#17131f;stroke-width:4px;pointer-events:none}
.tlab.big{fill:var(--text);font-size:12.5px}
.tn.on .tlab{fill:var(--gold-hi)}
.tbranch{fill:var(--faint);font:700 13px var(--f-display);letter-spacing:.14em;text-anchor:middle;text-transform:uppercase;pointer-events:none}
.tlegend{display:flex;gap:14px;flex-wrap:wrap;margin:0 2px 8px;font-size:12.5px;color:var(--dim)}
.tlegend span{display:flex;align-items:center;gap:6px}
.tlegend i{width:12px;height:12px;border-radius:50%;background:var(--deep);border:2px solid var(--line2)}
.tlegend i.on{background:var(--gold);border-color:var(--gold-hi)}
.tlegend i.av{border-color:var(--gold)}
.help{margin-bottom:10px;padding:12px 14px;border-radius:14px;background:var(--deep);border:1px solid var(--mana-lo)}
.help summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--mana)}
.help ol{margin:10px 0 6px;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--text)}
.help p{margin:6px 0 0;font-size:13.5px;color:var(--dim)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line2);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--good);box-shadow:0 0 6px var(--good)}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.relic{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--deep);border:1px solid #4a3a6e}
.relic .rico{grid-row:span 2;position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#2a1f3d;color:#d8c2ff;font:700 18px var(--f-display)}
.relic .rico svg{width:22px;height:22px}
.relic b{font-family:var(--f-display);font-size:13.5px;line-height:1.2}
.relic span{font-size:12px;color:var(--dim);line-height:1.25}
.relic.off{opacity:.5;border-color:var(--line)}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.art{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:8px 8px 8px 10px;border-radius:14px;background:var(--deep);border:1px solid #3b4d78}
.art .rico{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#1d2a47;color:#a9c8ff}
.art .rico svg{width:22px;height:22px}
.art .rico .cnt{background:#5b8be0}
.art.zero .rico{opacity:.55}
.art .at{min-width:0;display:flex;flex-direction:column;gap:1px}
.art b{font-family:var(--f-display);font-size:13.5px;line-height:1.2}
.art b small{font:800 11px var(--f-body);color:var(--dim);letter-spacing:.04em;margin-left:4px}
.art .at span{font-size:12px;color:var(--dim);line-height:1.25}
.art button{min-width:78px;padding:8px 10px;border-radius:12px;border:1px solid #5b8be0;background:#22345c;color:#dce8ff;font:800 12.5px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15;cursor:pointer}
.art button small{font-size:10.5px;font-weight:700;color:#9fb6e0}
.art button:disabled{opacity:.45;cursor:default}
.soulchip{display:inline-flex;align-items:baseline;gap:5px;color:#a9c8ff}
.unknown{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.unknown i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--deep);border:1px dashed var(--line2);color:var(--faint);font:700 14px var(--f-display);font-style:normal}
.unknown span{font-size:13px;color:var(--faint);margin-left:4px}
.help.ach{margin-top:14px;border-color:#2f6b4a}
.help.ach summary{color:var(--good)}
.achl{display:grid;gap:6px;margin-top:10px}
.achr{display:grid;grid-template-columns:24px minmax(0,1fr) 70px;align-items:center;gap:10px;font-size:13px}
.achr>i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:var(--void)}
.achr.on>i{background:var(--good);border-color:var(--good)}
.achr>i svg{width:14px;height:14px;stroke-width:3}
.achr b{display:block;font-size:13.5px}
.achr span{color:var(--dim)}
.achr.on{grid-template-columns:24px minmax(0,1fr)}
.achr .bar{height:5px;background:var(--line)}
.ghost.wide{width:100%;margin:8px 0 2px;padding:11px;font-weight:800;color:var(--mana);border-color:var(--mana-lo)}

/* Automator */
.rule{padding:12px;background:var(--deep);border:1px solid var(--line);border-radius:14px;display:grid;gap:8px;transition:border-color .2s,background .3s}
.rule.off{opacity:.6}
.rule.hit{border-color:var(--mana);background:rgba(122,168,255,.08)}
.rule-h{display:flex;align-items:center;gap:10px}
.rn{width:26px;height:26px;flex:none;border-radius:8px;background:var(--raise);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--mana)}
.rstat{flex:1;min-width:0;font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmove{display:flex;gap:4px}
.rmove button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:none;color:var(--dim);display:grid;place-items:center}
.rmove button svg{width:15px;height:15px}
.rmove button:disabled{opacity:.3;cursor:default}
.sw{position:relative;width:44px;height:26px;flex:none;border-radius:13px;border:0;background:var(--line2);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--mana)}
.sw[aria-pressed="true"]::after{transform:translateX(18px)}
.rl{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:8px}
.rl span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rl select{width:100%;min-width:0;padding:9px 30px 9px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);color:var(--text);font:600 14px var(--f-body);
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.power{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--deep);border:1px solid var(--line)}
.power .grow{flex:1;min-width:0}
.power b{font-family:var(--f-display);font-size:15px}
.power p{margin:0;font-size:13px;color:var(--dim)}
.log{display:grid;gap:4px;font-size:13px;color:var(--dim)}
.log div{display:flex;gap:8px}
.log span:first-child{color:var(--faint);flex:none;width:54px}

/* Navigation */
.nav{grid-area:nav;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border:0;background:none;border-radius:14px;color:var(--faint);font-size:12px;font-weight:800}
.nb svg{width:23px;height:23px}
.nb[aria-selected="true"]{color:var(--gold);background:var(--raise)}
.badge{position:absolute;top:3px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:800;line-height:18px;text-align:center}
.badge.xp{background:var(--xp);color:#1c0f33} .badge.mana{background:var(--mana);color:#0d1430}

/* Modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,4,8,.8);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:22px;display:grid;gap:14px;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.box h2{margin:0;font-family:var(--f-display);font-size:22px;text-wrap:balance}
.box p{margin:0;color:var(--dim)}
.who{display:flex;gap:10px;align-items:flex-start}
.who p{color:var(--text);font-style:italic}
.mbtns{display:grid;gap:8px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.box.ad{text-align:center;justify-items:center}
.box.ad .bar{width:100%;background:var(--line)}
.adcount{font-family:var(--f-display);font-size:56px;font-weight:700;color:var(--gold);line-height:1}
.reward{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--gold-hi)}
@media (max-width:420px){.gold{font-size:26px}.zname{min-width:58px}}
@media (prefers-reduced-motion:reduce){.gold.bump,.row.flash,.buy.glow,.box,.tn.av circle.halo{animation:none}.bar i{transition:none}}

<script>
(() => {
'use strict';
const $=s=>document.querySelector(s);
/* Zoomen verhindern: Pinch (iOS-Gesten und Mehrfinger), Doppeltipp (über touch-action), Strg+Mausrad, Strg+Plus/Minus */

function fmt(n){
  if(!isFinite(n))return '∞';if(n<0)return '-'+fmt(-n);
  if(n<1000)return (n<100&&n%1>0.05)?n.toFixed(1).replace('.',','):String(Math.floor(n));
  const u=['','K','M','Mrd','Bio','Brd','Trio','Trd','Qa','Qi','Sx','Sp','Ok','No','De'];
  const i=Math.floor(Math.log10(n)/3);if(i>=u.length)return n.toExponential(2).replace('.',',').replace('e+','e');
  const v=n/Math.pow(1000,i);return v.toFixed(v<10?2:v<100?1:0).replace('.',',')+' '+u[i];
}

  else if(m.type==='bat'){const fy=-s*0.95+bob*3,fl=Math.sin(t*0.025+m.seed*5);
    for(const d of[-1,1]){cx.beginPath();cx.moveTo(0,fy-s*0.05);cx.lineTo(d*s*0.66,fy-s*0.28*fl-s*0.12);cx.lineTo(d*s*0.55,fy+s*0.06);cx.lineTo(d*s*0.4,fy-s*0.01);cx.lineTo(d*s*0.28,fy+s*0.13);cx.closePath();F(pal[1]);
      cx.strokeStyle=rgba('#000000',0.3);cx.lineWidth=lw*0.7;cx.beginPath();cx.moveTo(d*s*0.08,fy);cx.lineTo(d*s*0.55,fy+s*0.06);cx.moveTo(d*s*0.08,fy);cx.lineTo(d*s*0.4,fy-s*0.01);cx.stroke()}

    cx.beginPath();cx.ellipse(s*0.05,by,s*0.44,s*0.32,0,Math.PI,TAU);cx.lineTo(s*0.49,by+s*0.06);cx.lineTo(-s*0.39,by+s*0.06);cx.closePath();F(grad(by-s*0.32,by+s*0.2));
    cx.fillStyle='rgba(255,255,255,.35)';cx.beginPath();cx.ellipse(-s*0.05,by-s*0.2,s*0.16,s*0.05,-0.2,0,TAU);cx.fill();
    cx.strokeStyle=rgba('#000000',0.35);cx.lineWidth=lw;cx.beginPath();cx.moveTo(s*0.05,by-s*0.32);cx.lineTo(s*0.05,by+s*0.05);cx.stroke();
    cx.beginPath();cx.arc(-s*0.42,by-s*0.02,s*0.16,0,TAU);F(pal[1]);
    cx.beginPath();cx.moveTo(-s*0.52,by-s*0.09);cx.quadraticCurveTo(-s*0.74,by-s*0.38,-s*0.6,by-s*0.46);cx.lineTo(-s*0.5,by-s*0.16);cx.closePath();F(pal[2]);
    glowEyes(-s*0.48,by-s*0.05,s*0.032,s*0.05)}
  else if(m.type==='golem'){
    const blk=(bx,by,bw,bh,c)=>{cx.beginPath();cx.roundRect?cx.roundRect(bx,by,bw,bh,s*0.07):cx.rect(bx,by,bw,bh);F(c)};
    blk(-s*0.25,-s*0.36,s*0.17,s*0.36,pal[1]);blk(s*0.08,-s*0.36,s*0.17,s*0.36,pal[1]);

    blk(-s*0.55,-s*0.86+Math.sin(t*0.004)*s*0.03,s*0.17,s*0.48,pal[1]);blk(s*0.38,-s*0.86-Math.sin(t*0.004)*s*0.03,s*0.17,s*0.48,pal[1]);
    additive(()=>{cx.strokeStyle=rgba(pal[2],0.7);cx.lineWidth=lw*1.2;cx.beginPath();cx.moveTo(-s*0.12,-s*0.84);cx.lineTo(0,-s*0.66);cx.lineTo(-s*0.07,-s*0.46);cx.moveTo(s*0.15,-s*0.8);cx.lineTo(s*0.22,-s*0.6);cx.stroke()});

function monTop(m,u){const s=u*(m.boss?1.45:1);return {bat:-s*1.4,wisp:-s*1.3,golem:-s*1.22,shroom:-s*1.12,beetle:-s*0.78,slime:-s*0.68,chest:-s*0.95}[m.type]-(m.boss?s*0.22:0)}

/* ================= Kampf-Ereignisse ================= */
function handleEvents(){
  for(const e of ECON.flushEv()){
    const mp={x:W*0.7,y:groundY()},u=unit(),m=curMon;
    if(e[0]==='hit'){const [,d,src,crit]=e;monFlash=1;monKick=src==='auto'?6:crit?16:10;
      const hy=mp.y+(m?monTop(m,u)*0.5:-u*0.5);
      if(src==='auto'){if(swingT>0.7){swingT=0;swingBig=false;swingKind=comboN++%3}if(performance.now()-lastAuto>90){sfx.hit(0.8);lastAuto=performance.now()}}
      if(src==='tap'||src==='strike'){swingT=0;swingBig=src==='strike';swingKind=swingBig?3:comboN++%3}
      slashes.push({x:mp.x,y:hy,k:swingKind,a:-0.6+Math.random()*0.4,l:1,big:src==='strike'||crit,c:src==='auto'?'#cfe0ff':crit?'#ffdb80':'#ffffff'});
      impacts.push({x:mp.x-u*0.15+(Math.random()-0.5)*u*0.2,y:hy+(Math.random()-0.5)*u*0.2,l:1,big:crit||src==='strike',r:Math.random()*TAU});
      spark(mp.x-u*0.2,hy,crit?16:src==='auto'?3:7,crit?'#ffdb80':'#ffffff',crit?1.4:0.9);if(m)chunk(mp.x,hy,crit?7:2,m.pal[0]);
      const sz=src==='strike'?32:crit?28:src==='auto'?14:19;
      floatTxt(mp.x+(Math.random()-0.5)*u*0.5,hy-u*0.25,(crit?'KRIT ':'')+fmt(d),src==='auto'?'#cfe0ff':crit||src==='strike'?'#ffdb80':'#ffffff',sz,src==='auto'?0.8:1.1,crit?(Math.random()-0.5)*0.3:0);
      if(crit||src==='strike'){sfx.crit();shake(src==='strike'?10:6);punch=1;hitStop(0.06)}else if(src!=='auto')shake(src==='whirl'?2:1.5)}
    else if(e[0]==='kill'){const [,g,x,boss,chest]=e;hitStop(boss?0.18:chest?0.12:0.045);
      if(chest){for(let i=0;i<14;i++)coin(mp.x+(Math.random()-0.5)*u*0.5,mp.y-u*0.4,true);banner('SCHATZ!',`+${fmt(g)} Gold`,'#ffdb80','ach');sfx.claim();shake(8);flashA=0.35;flashC='#ffdb80'}
      if(m){corpses.push({m,x:mp.x,y:mp.y,t:0});chunk(mp.x,mp.y-u*0.4,boss?34:12,m.pal[0]);spark(mp.x,mp.y-u*0.4,boss?36:10,m.pal[2],1.3);rings.push({x:mp.x,y:mp.y-u*0.45,r:u*0.2,l:1,c:m.pal[2],big:1})}
      for(let i=0;i<(boss?18:Math.min(8,3+Math.floor(Math.log10(1+g))));i++)coin(mp.x+(Math.random()-0.5)*u*0.4,mp.y-u*0.4,boss);
      floatTxt(mp.x,mp.y-u*1.25,'+'+fmt(g)+' Gold','#ffdb80',boss?26:16,1.4);sfx.kill();
      if(boss){shake(16);flashA=0.7;flashC='#ffdb80';sfx.bossDown();banner('BOSS BESIEGT',`+${fmt(g)} Gold`,'#ffdb80','win');say('grimm',['Der war zäh. Nächster!','Boss erledigt. Ich bin beeindruckt. Von mir.','Und weg ist er. Weiter!'][S.bossKills%3])}}
    else if(e[0]==='level'){const hp=heroPos();lvlGlow=1;beam=1;rings.push({x:hp.x,y:hp.y-u*0.6,r:u*0.3,l:1,c:'#b68cff',big:1});spark(hp.x,hp.y-u*0.6,24,'#d2b8ff',1.2);
      floatTxt(hp.x,hp.y-u*1.55,'LEVEL '+e[1],'#d2b8ff',24,1.6);sfx.level();
      if(e[1]===2)say('grimm','Talentpunkt! Schau unter „Talente“ und lern was Nützliches.')}
    else if(e[0]==='bossFail'){sfx.fail();flashA=0.5;flashC='#ef5b6b';banner('ZU LANGSAM','Zurück zum Farmen, bis du stärker bist','#ff8a8a','fail');shake(8);
      say('grimm','Zu langsam für den Boss. Wir farmen eine Zone tiefer, bis du stärker bist. Weiterziehen ist aus.')}
    else if(e[0]==='zone'){const z=e[1];
      if(isBossZone(z)){const bm=monsterOf(z,S.kills+S.killsAll*7);sfx.bossIntro();shake(10);banner('BOSS',bm.name,'#ff6a7a','boss')}
      else{banner('ZONE '+z,biome(z).name,'#efe9f4','zone');if((z-1)%10===0&&z>1)say('grimm',`Willkommen in ${biome(z).name}. Hier riecht es nach Ärger.`)}}
    else if(e[0]==='cast'){skillFx(e[1])}
    else if(e[0]==='relic'){const r=RELICS.find(x=>x.id===e[1]);relicDrop={r,x:mp.x,y:mp.y-u*0.8,vy:-260,t:0};sfx.level();
      banner('RELIKT GEFUNDEN',`${r.name} · Stufe ${e[2]}`,'#c9a8ff','relic');say('grimm',e[2]===1?`Ein Relikt! ${r.name}: ${r.desc} Bleibt auch nach einer Wiedergeburt.`:`Noch ein ${r.name}. Jetzt Stufe ${e[2]}.`)}
    else if(e[0]==='ach'){const a=ACH.find(x=>x.id===e[1]);banner('ERFOLG',a.name+' · +2 % Schaden','#77d39a','ach');sfx.claim()}
  }
}
function skillFx(id){const mp=monPos(),hp=heroPos(),u=unit();sfx.skill();const b=$('#sk-'+id);if(b){b.classList.remove('fired');void b.offsetWidth;b.classList.add('fired')}
  if(id==='whirl')rings.push({x:hp.x,y:hp.y-u*0.6,r:u*0.4,l:1,c:'#cfe0ff',big:1});
  else if(id==='frenzy'){rings.push({x:hp.x,y:hp.y-u*0.6,r:u*0.3,l:1,c:'#ff6a4a',big:1});floatTxt(hp.x,hp.y-u*1.4,'RASEREI','#ff8a6a',20,1.2);flashA=0.25;flashC='#ff6a4a'}

function drawBanners(dt){

    const big=small?Math.min(30,W*0.08):b.kind==='relic'?Math.min(40,W*0.095):Math.min(52,W*0.13);
    if(b.kind!=='zone'){const g=cx.createLinearGradient(-W/2,0,W/2,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.5,'rgba(10,6,14,.72)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(-W/2,-big*0.85,W,big*1.9)}

}

/* ================= Automator ================= */
const STONES={
  always:{t:'Immer',f:()=>true},
  energy50:{t:'Energie über 50 %',f:()=>S.energy>energyMax()*0.5},
  energyFull:{t:'Energie ist voll',f:()=>S.energy>=energyMax()-0.5},
  boss:{t:'Boss-Kampf läuft',f:()=>isBossZone(S.zone)&&S.walk<=0},
  bossLow:{t:'Boss-Zeit unter 10 s',f:()=>isBossZone(S.zone)&&S.walk<=0&&S.bossLeft<10},
  noFrenzy:{t:'Raserei ist nicht aktiv',f:()=>!buffOn('frenzy')},
  hpHigh:{t:'Gegner hat über 50 % Leben',f:()=>S.walk<=0&&S.mhp>S.mmax*0.5},
  afford:{t:'Ausrüstung ist bezahlbar',f:()=>visibleGear().some(g=>S.gold>=stationCost(g))},
  farming:{t:'Weiterziehen ist aus',f:()=>!S.advance},
};
const GEMS={
  strike:{t:'Machtschlag wirken',f:()=>econCast('strike')&&'Machtschlag'},
  whirl:{t:'Klingenwirbel wirken',f:()=>econCast('whirl')&&'Klingenwirbel'},
  frenzy:{t:'Raserei wirken',f:()=>econCast('frenzy')&&'Raserei'},
  greed:{t:'Goldrausch wirken',f:()=>econCast('greed')&&'Goldrausch'},
  slow:{t:'Zeitsand wirken',f:()=>econCast('slow')&&'Zeitsand'},
  buyCheap:{t:'Günstigstes Ausrüstungsteil verbessern',f:()=>{let g=null;for(const x of visibleGear())if(!g||stationCost(x)<stationCost(g))g=x;if(!g||S.gold<stationCost(g))return 0;
    const m=S.mode;S.mode=1;const r=buyGear(g.id,null,true);S.mode=m;return r&&(r.gate?`Meilenstein für ${g.name}`:`${g.name} auf Level ${r.after}`)}},
  buyGates:{t:'Meilenstein-Upgrades einbauen',f:()=>{let n=0;for(const g of visibleGear())if(gated(g.id)&&S.gold>=gateCost(g)&&buyGear(g.id,null,true))n++;return n&&`${n} Meilenstein${n>1?'e':''} eingebaut`}},
  advance:{t:'Weiterziehen einschalten',f:()=>{if(S.advance)return 0;S.advance=true;return 'Weiterziehen eingeschaltet'}},
};
let autoAcc=0,autoRev=0;const autoLog=[],ruleHit={};
function GEM_READY(g){const now=Date.now();
  if(SKILLS[g]){const s=SKILLS[g];if(now<(S.cd[g]||0)||S.energy<s.cost)return false;if(g==='slow')return isBossZone(S.zone)&&S.walk<=0;if(g==='strike'||g==='whirl')return S.walk<=0;return true}
  if(g==='buyCheap')return visibleGear().some(x=>S.gold>=stationCost(x));
  if(g==='buyGates')return visibleGear().some(x=>gated(x.id)&&S.gold>=gateCost(x));
  if(g==='advance')return !S.advance;return false}
function loadPreset(){const R=[],add=(s,g)=>{if(stoneOn(s)&&gemOn(g)&&R.length<S.rules.length)R.push({s,g,on:true,n:0})};
  add(stoneOn('bossLow')?'bossLow':'boss','slow');add('always','buyGates');add(stoneOn('noFrenzy')?'noFrenzy':'always','frenzy');add('always','greed');
  add(stoneOn('energy50')?'energy50':'always','whirl');add('always','strike');add(stoneOn('afford')?'afford':'always','buyCheap');add(stoneOn('farming')?'farming':'always','advance');
  const rest=S.rules.length-R.length;for(let i=0;i<rest;i++)R.push({s:'always',g:'strike',on:false,n:0});
  S.rules=R;for(const k in ruleHit)delete ruleHit[k];autoRev++;sfx.claim();say('grimm','Hab dir die Regeln eingestellt, die gerade Sinn ergeben. Oben steht, was am wichtigsten ist.')}
/* Talentbaum: Raster und Kurzbeschriftungen */
const TG=88,TOX=6.6,TOY=6.4,TW=13.2,TH=12.8;
function shortLabel(n){const f=n.fx,p=v=>Math.round(v*100)+' %';if(n.id==='root')return 'Ursprung';if(n.big||n.key)return n.name;
  if(f.tap)return 'Tipp +'+p(f.tap);if(f.dmg)return 'Schaden +'+p(f.dmg);if(f.crit)return 'Krit +'+p(f.crit);if(f.critDmg)return 'Kritwucht +'+p(f.critDmg);
  if(f.speed)return 'Tempo +'+p(f.speed);if(f.auto)return 'Auto +'+p(f.auto);if(f.energyMax)return 'Energie +'+f.energyMax;if(f.regen)return 'Regen. +'+p(f.regen);
  if(f.gold)return 'Gold +'+p(f.gold);if(f.rebate)return 'Rabatt '+p(f.rebate);if(f.xp)return 'EP +'+p(f.xp);if(f.bossTime)return 'Boss +'+f.bossTime+' s';
  if(f.stone||f.gem)return n.name.split(': ')[1]||n.name;if(f.slots)return '+'+f.slots+' Platz';if(f.tick)return 'Takt ×2';return n.name}
function centerTree(sc){const r=TNODE.root;sc.scrollTo({left:(r.x+TOX)*TG-sc.clientWidth/2,top:(r.y+TOY)*TG-sc.clientHeight/2})}
function runAutomator(){
  if(!automatorOn()||!S.autoOn)return;const now=Date.now();
  for(let i=0;i<Math.min(autoSlots(),S.rules.length);i++){const r=S.rules[i];if(!r.on||!stoneOn(r.s)||!gemOn(r.g))continue;
    if(!STONES[r.s].f())continue;const res=GEMS[r.g].f();if(!res)continue;
    r.n=(r.n||0)+1;ruleHit[i]=now;autoLog.unshift({t:now,i,txt:res});if(autoLog.length>8)autoLog.pop();return}
}

function buyGear(id,btn,auto){const g=GEARX[id],row=btn?btn.closest('.row'):null;const r=econBuyGear(id);if(!r)return null;spent();
  if(row){row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash')}

  if(!auto){if(r.gate)say('grimm',`${g.name}: Meilenstein bei Level ${r.level}. Schaden ×2. Nächster bei ${r.next}.`);
    else if(gated(id))say('grimm',`Level ${r.after}. Tipp nochmal drauf für den Meilenstein.`);else if(r.before===0&&id!=='sword')say('grimm',`${g.name}. Steht dir. Fast.`)}

  box.innerHTML=m.html+`<div class="mbtns">${m.buttons.map((b,i)=>`<button type="button" class="buy wide ${b.cls||''}" data-mi="${i}"><span class="bc">${b.label}</span>${b.sub?`<span class="bq">${b.sub}</span>`:''}</button>`).join('')}</div>`;
  $('#modal').hidden=false;box.querySelectorAll('[data-mi]').forEach(btn=>btn.addEventListener('click',()=>{const b=m.buttons[+btn.dataset.mi];sfx.ui();const r=b.fn&&b.fn();if(r!=='keep')nextModal()},{once:true}));
  const f=box.querySelector('[data-mi]');if(f)f.focus()}
function watchAd(cb){mOpen=true;const box=$('#modalBox');box.className='box ad';
  box.innerHTML=`<p class="eyebrow">Werbepause · Platzhalter</p><div class="adcount" id="adc">3</div><p>Im fertigen Spiel läuft hier ein kurzes Werbevideo, zum Beispiel über AdMob. Danach gibt es die Belohnung.</p><div class="bar mana"><i id="adb"></i></div>`;
  $('#modal').hidden=false;const t0=performance.now();
  const iv=setInterval(()=>{const e=(performance.now()-t0)/3000,b=$('#adb'),c=$('#adc');if(b)b.style.width=Math.min(100,e*100)+'%';if(c)c.textContent=Math.max(1,Math.ceil(3-e*3));
    if(e>=1){clearInterval(iv);box.className='box';cb();nextModal()}},50)}
function turbo(){if(mOpen||boostOn()||Date.now()<S.boostReady)return;sfx.ui();watchAd(()=>{econTurbo();sfx.claim();say('grimm','Doppeltes Gold für fünf Minuten. Ich hab nicht gefragt, woher.')})}

  [...panelEl.children].forEach(p=>p.classList.toggle('cur',p===pg));pg.scrollTop=0;renderPanel();if(t==='fight')requestAnimationFrame(()=>{resize();updOnPage()})}
const viewEl=$('#view'),appEl=$('.app');
function placeView(){const pg=pageEl('fight');if(isWide()){if(viewEl.parentNode!==appEl)appEl.insertBefore(viewEl,panelEl);if(curTab==='fight')curTab='gear'}
  else if(viewEl.parentNode!==pg)pg.appendChild(viewEl);requestAnimationFrame(()=>{switchTab(curTab);resize()})}
function updOnPage(){updGoldT()}
matchMedia('(min-width:860px)').addEventListener('change',placeView);
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){sfx.ui();switchTab(b.dataset.tab)}});
panelEl.addEventListener('click',e=>{
  const nd=e.target.closest('[data-node]');if(nd){selNode=nd.dataset.node;sfx.ui();renderPanel(true);return}
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.buy)buyGear(b.dataset.buy,b);
  else if(b.dataset.mode){const m=b.dataset.mode;S.mode=(m==='max'||m==='next')?m:+m;sfx.ui()}
  else if(b.dataset.learn)learnNode(b.dataset.learn);
  else if(b.dataset.goto)return switchTab(b.dataset.goto);
  else if(b.hasAttribute('data-center')){const sc=pageEl('tree').querySelector('#tscroll');if(sc)centerTree(sc);return}
  else if(b.hasAttribute('data-preset')){loadPreset();return renderPanel(true)}
  else if(b.hasAttribute('data-autoon')){S.autoOn=!S.autoOn;sfx.ui()}
  else if(b.dataset.rtog){const r=S.rules[+b.dataset.rtog];r.on=!r.on;sfx.ui()}
  else if(b.dataset.rup||b.dataset.rdn){const i=+(b.dataset.rup||b.dataset.rdn),j=b.dataset.rup?i-1:i+1;if(j<0||j>=autoSlots())return;
    [S.rules[i],S.rules[j]]=[S.rules[j],S.rules[i]];const h=ruleHit[i];ruleHit[i]=ruleHit[j];ruleHit[j]=h;autoRev++;sfx.ui();return renderPanel(true)}
  else if(b.dataset.art){if(econBuyArt(b.dataset.art)){sfx.buy();shake(3)}return renderPanel(true)}
  else if(b.hasAttribute('data-rebirth'))return rebirth();
  else if(b.hasAttribute('data-wipe'))return wipe();
  else if(b.hasAttribute('data-sound'))toggleSound();
  renderPanel()});
panelEl.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('help')&&!e.target.open){S.autoHelpSeen=true}},true);
panelEl.addEventListener('change',e=>{const s=e.target;let i;
  if(s.dataset.rsSel!==undefined){i=+s.dataset.rsSel;S.rules[i].s=s.value}else if(s.dataset.rgSel!==undefined){i=+s.dataset.rgSel;S.rules[i].g=s.value}else return;
  S.rules[i].n=0;delete ruleHit[i];sfx.ui();save()});
function rebirth(){const g=soulsFor(S.maxRun);if(g<1)return;
  if(Date.now()>rebirthArmed){rebirthArmed=Date.now()+4000;renderPanel(true);return}
  econRebirth();rebirthArmed=0;dispGold=0;selNode='k1';treeScroll=null;sfx.level();shake(10);
  if(S.rebirths===1)say('grimm',`${fmt(S.souls)} Seelen! Unter Reise kannst du damit Artefakte kaufen. Der Stein der Ruhe macht dich stärker, wenn du mal nicht tippst.`);
  else say('mara',`Neu geboren mit ${fmt(S.souls)} Seelen. Diesmal komme ich weiter.`);switchTab('gear')}
function wipe(){if(Date.now()>wipeArmed){wipeArmed=Date.now()+4000;renderPanel(true);return}
  const snd=S.sound;S=freshState();S.sound=snd;spawn();S.walk=0;wipeArmed=0;dispGold=0;save();showIntro();switchTab('gear')}
function toggleSound(){S.sound=!S.sound;$('#soundBtn').innerHTML=svg(S.sound?'snd':'mute');if(S.sound)sfx.ui();renderPanel(true)}
$('#soundBtn').addEventListener('click',toggleSound);
$('#turbo').addEventListener('click',turbo);
$('#zPrev').addEventListener('click',()=>{if(S.zone<=1)return;S.advance=false;enterZone(S.zone-1);sfx.ui()});
$('#zNext').addEventListener('click',()=>{if(S.zone>=S.maxRun)return;enterZone(S.zone+1);sfx.ui()});
$('#zAdv').addEventListener('click',()=>{S.advance=!S.advance;sfx.ui();if(S.advance&&S.kills>=KILLS_PER_ZONE&&!isBossZone(S.zone))enterZone(S.zone+1)});
$('#zPrev').innerHTML=svg('prev');$('#zNext').innerHTML=svg('next');$('#zAdv').innerHTML=svg('ff');

/* ================= HUD ================= */
let skKey='';
function updateUI(){
  $('#dps').textContent=`Tipp ${fmt(tapDamage())} · Auto ${fmt(autoDps())}/s`+(boostOn()?' · Gold ×2':'');
  $('#lvlTxt').textContent=`Level ${S.level}`+(pointsFree()>0?` · +${pointsFree()}`:'');
  $('#xpTxt').textContent=`${Math.floor(S.xp/xpNeed(S.level)*100)} %`;$('#xpBar').style.width=clamp(S.xp/xpNeed(S.level)*100,0,100)+'%';
  $('#enTxt').textContent=`${Math.floor(S.energy)} / ${energyMax()}`;$('#enBar').style.width=clamp(S.energy/energyMax()*100,0,100)+'%';
  $('#zNum').textContent='Zone '+S.zone;$('#zSub').textContent=isBossZone(S.zone)?'Boss':`${Math.min(S.kills,KILLS_PER_ZONE)}/${KILLS_PER_ZONE}`;
  $('#zPrev').disabled=S.zone<=1;$('#zNext').disabled=S.zone>=S.maxRun;const za=$('#zAdv');za.classList.toggle('on',S.advance);za.title=S.advance?'Weiterziehen ist an':'Weiterziehen ist aus (farmen)';
  const now=Date.now(),tb=$('#turbo');
  if(boostOn()){tb.disabled=false;tb.classList.add('on');tb.innerHTML=`Gold ×2 · ${secs(S.boostEnd-now)}`}
  else if(now<S.boostReady){tb.disabled=true;tb.classList.remove('on');tb.textContent=`×2 in ${secs(S.boostReady-now)}`}
  else{tb.disabled=false;tb.classList.remove('on');tb.innerHTML=`${svg('play')}Gold ×2`}
  const sk=learnedSkills(),k=sk.join();
  if(k!==skKey){skKey=k;$('#skillbar').innerHTML=sk.map((id,i)=>`<button class="sk" type="button" id="sk-${id}" data-skill="${id}" aria-label="${SKILLS[id].name}" title="${SKILLS[id].name}: ${SKILLS[id].desc}"><span class="k">${i+1}</span>${svg(SKILLS[id].ic)}<span class="c"></span></button>`).join('')}
  for(const id of sk){const b=$('#sk-'+id),s=SKILLS[id],left=Math.max(0,(S.cd[id]||0)-now);b.style.setProperty('--cd',left/s.cd);
    b.disabled=left>0||S.energy<s.cost||(id==='slow'&&!(isBossZone(S.zone)&&S.walk<=0));b.querySelector('.c').textContent=left>0?Math.ceil(left/1000)+' s':s.cost+' E'}
  const badges={fight:0,gear:visibleGear().filter(g=>S.gold>=stationCost(g)).length,tree:pointsFree(),auto:0,world:soulsFor(S.maxRun)>0?'!':0};
  document.querySelectorAll('.nb').forEach(b=>{const v=badges[b.dataset.tab],i=b.querySelector('.badge');i.hidden=!v||b.dataset.tab===curTab;i.textContent=v;i.className='badge'+(b.dataset.tab==='tree'?' xp':b.dataset.tab==='world'?' mana':'')});
  document.querySelectorAll('[data-gc]').forEach(e=>{const v=fmt(S.gold);if(e.textContent!==v)e.textContent=v});
  renderPanel();
}
$('#skillbar').addEventListener('click',e=>{const b=e.target.closest('[data-skill]');if(b)castSkill(b.dataset.skill)});

/* ================= Speichern & Start ================= */
function save(){if(!S)return;S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
let lastT=0,lastUI=0,gold5=[];
function frame(t){
  const raw=Math.max(0,(t-lastT)/1000);lastT=t;
  if(raw>5){const r=econOffline(Math.min(raw,8*3600));if(r.gold>0)floatTxt(W/2,H/2,'+'+fmt(r.gold)+' Gold','#ffdb80',22,2)}
  else if(raw>0){let left=raw;while(left>0){const d=Math.min(left,0.05);econTick(d);left-=d}}
  if(automatorOn()&&S.autoOn){autoAcc+=Math.min(raw,1);const iv=autoInterval();if(autoAcc>=iv){autoAcc%=iv;runAutomator()}}
  handleEvents();
  const dt=Math.min(raw,0.05);
  if(S.gold<dispGold)dispGold=S.gold;else dispGold+=(S.gold-dispGold)*Math.min(1,dt*9);if(S.gold-dispGold<0.05)dispGold=S.gold;
  const txt=fmt(dispGold),el=$('#goldNum');if(el.textContent!==txt)el.textContent=txt;
  draw(t,dt);
  if(t-lastUI>150){lastUI=t;gold5.push([t,S.goldRun]);while(gold5.length>40)gold5.shift();const a=gold5[0];goldRate=t>a[0]?Math.max(0,(S.goldRun-a[1])/((t-a[0])/1000)):0;updateUI()}
  requestAnimationFrame(frame)}
function start(data){
  const hot=!!(data&&data.S);
  S=Object.assign(freshState(),hot?data.S:(load()||{}));if(!S.daily)S.daily={day:'',streak:0};
  dispGold=S.gold;$('#soundBtn').innerHTML=svg(S.sound?'snd':'mute');resize();
  if(!hot&&!(S.mhp>0))spawn();
  if(!S.taps){const h=document.createElement('div');h.id='hint';h.textContent='Tippe, um anzugreifen';
    h.style.cssText='position:absolute;left:0;right:0;top:46%;text-align:center;font:700 15px var(--f-display);letter-spacing:.12em;color:var(--gold-hi);text-shadow:0 2px 8px #000;pointer-events:none';$('#view').appendChild(h)}
  if(!hot){
    if(!S.intro)showIntro();
    else{
      const away=Math.min((Date.now()-S.last)/1000,8*3600);
      if(away>60){const r=econOffline(away);ECON.flushEv();const h=Math.floor(away/3600),m=Math.floor(away%3600/60);dispGold=S.gold*0.6;
        if(r.gold>0)modal(`<p class="eyebrow">Willkommen zurück</p><div class="who"><div class="av">G</div><p>„Du warst weg, ich hab weitergehauen. Gern geschehen.“</p></div>
          <div class="reward">+${fmt(r.gold)} Gold</div><p>${fmt(r.kills)} Monster in ${h?h+' Std. ':''}${m} Min. per Auto-Angriff besiegt${away>=8*3600?' (maximal 8 Stunden)':''}.</p>`,
          [{label:'Einsammeln',fn:()=>giveGold(0)},{label:'Verdoppeln',sub:'Werbung ansehen',cls:'mana',fn:()=>{watchAd(()=>giveGold(r.gold));return 'keep'}}])}
      const today=dayKey(0);
      if(S.daily.day!==today){const streak=S.daily.day===dayKey(-1)?Math.min(7,S.daily.streak+1):1;S.daily={day:today,streak};const b=nice(goldFor(Math.max(1,S.zone))*15*streak);
        modal(`<p class="eyebrow">Tagesbonus · Tag ${streak} von 7</p><h2>Eine Truhe am Wegesrand</h2><div class="pips">${Array.from({length:7},(_,i)=>`<i class="${i<streak?'on':''}"></i>`).join('')}</div>
          <div class="reward">+${fmt(b)} Gold</div><p>Jeden Tag in Folge wird die Truhe größer.</p>`,
          [{label:'Abholen',fn:()=>giveGold(b)},{label:'Doppelt abholen',sub:'Werbung ansehen',cls:'mana',fn:()=>{watchAd(()=>giveGold(b*2));return 'keep'}}])}
    }
  }
  placeView();updateUI();setInterval(save,5000);
  requestAnimationFrame(t=>{lastT=t;frame(t)});
}
window.claude?.hot?.snapshot?.(()=>({S:JSON.parse(JSON.stringify(S))}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>

</html>
